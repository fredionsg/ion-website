<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ION Caregivers Circle</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap"
  rel="stylesheet">

<style>
  :root {
    --paper:      #fff5e3;
    --paper-deep: #ffead0;
    --ink:        #1f1a2e;

    --blue:       #3F7CBF;
    --blue-deep:  #2a5c93;
    --green:      #76C691;
    --green-deep: #4ea272;
    --yellow:     #FFC614;
    --yellow-deep:#cf9d00;
    --coral:      #EF534C;
    --coral-deep: #c63a33;

    --lavender:      #b9aaee;
    --lavender-soft: #d9d0f7;
    --lavender-deep: #7a68c9;

    --sage:       #9ab98e;
    --sage-deep:  #6c9462;

    /* Skin tones */
    --skin-1: #e6b58a;   /* warm light */
    --skin-2: #c4885d;   /* warm medium */
    --skin-3: #8e5a3a;   /* warm deep */
    /* Hair */
    --hair-dark: #2b1d18;
    --hair-black:#15100c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #18172a;
    font-family: "Bricolage Grotesque", sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 16px;
  }

  /* Poster: 1080 × 1350 (Instagram 4:5 portrait) */
  .poster {
    width: 1080px;
    height: 1350px;
    background: var(--paper);
    position: relative;
    overflow: hidden;
    box-shadow: 0 50px 120px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,0,0,0.05);
    transform-origin: center;
  }

  @media (max-width: 1200px) { .poster { transform: scale(0.7); } }
  @media (max-width: 800px)  { .poster { transform: scale(0.45); } }
  @media (max-width: 500px)  { .poster { transform: scale(0.32); } }

  /* Atmospheric color wash — softer, calmer */
  .wash {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 700px 500px at 80% 10%, rgba(185,170,238,0.36) 0%, transparent 60%),
      radial-gradient(ellipse 600px 600px at 10% 80%, rgba(255,198,20,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 500px 400px at 60% 95%, rgba(118,198,145,0.20) 0%, transparent 60%);
    pointer-events: none;
  }

  /* Quiet paper grain */
  .grain {
    position: absolute; inset: 0;
    pointer-events: none;
    opacity: 0.07;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    mix-blend-mode: multiply;
  }

  /* === ION Logo (larger now) === */
  .logo {
    position: absolute;
    top: 96px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
  }
  .logo img {
    height: 78px;
    width: auto;
    filter: contrast(1.05) brightness(0.95);
  }

  /* === Conversation Garden SVG canvas === */
  .garden {
    position: absolute;
    top: 220px;
    left: 0;
    width: 100%;
    height: 880px;
    z-index: 3;
  }

  /* === Title (bottom) === */
  .title {
    position: absolute;
    bottom: 110px;
    left: 0; right: 0;
    text-align: center;
    z-index: 4;
    padding: 0 60px;
  }
  .title .l1, .title .l2 {
    display: block;
    font-family: "Bricolage Grotesque", sans-serif;
    line-height: 0.9;
    letter-spacing: -0.035em;
  }
  .title .l1 {
    font-variation-settings: "opsz" 96, "wght" 700, "wdth" 90;
    font-size: 132px;
    color: var(--ink);
  }
  .title .l2 {
    font-variation-settings: "opsz" 96, "wght" 800, "wdth" 100;
    font-size: 156px;
    color: var(--lavender-deep);
    margin-top: -8px;
    font-style: italic;
  }
  .title .l2 .dot {
    color: var(--coral);
  }
  .baseline {
    margin: 28px auto 0;
    width: 64px;
    height: 4px;
    border-radius: 2px;
    background: var(--ink);
  }
</style>
</head>
<body>

<div class="poster">
  <div class="wash"></div>
  <div class="grain"></div>

  <!-- ION Logo (bigger) -->
  <div class="logo">
    <img src="/Assets/LogoWide-01.png" alt="ION Singapore" />
  </div>

  <!--
    CONVERSATION GARDEN — refined
    Three illustrated characters in flat-style portraits, each paired with
    a speech bubble suggesting their voice in the circle. Two background
    eucalyptus sprigs for botanical warmth. No floating clutter.
  -->
  <svg class="garden" viewBox="0 0 1080 880" xmlns="http://www.w3.org/2000/svg">

    <defs>
      <!-- Soft drop shadow -->
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
        <feOffset dx="0" dy="11" result="off"/>
        <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
        <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>

      <!-- Eucalyptus sprig (reusable) -->
      <g id="sprig">
        <path d="M 0 0 Q 6 -18 18 -22 Q 8 -16 8 -2 Z" fill="#9ab98e"/>
        <path d="M 8 -28 Q 14 -46 26 -50 Q 16 -44 16 -30 Z" fill="#7da673"/>
        <path d="M 14 -56 Q 20 -74 32 -78 Q 22 -72 22 -58 Z" fill="#9ab98e"/>
        <path d="M -8 -16 Q -16 -32 -6 -42 Q -4 -32 -2 -22 Z" fill="#7da673"/>
        <path d="M -2 -46 Q -10 -62 0 -72 Q 2 -62 4 -52 Z" fill="#9ab98e"/>
        <path d="M 18 -22 Q 14 -36 22 -50 Q 18 -64 26 -78"
              stroke="#5e8a55" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M -4 -8 Q -8 -22 -2 -36 Q -6 -50 2 -64"
              stroke="#5e8a55" stroke-width="2" stroke-linecap="round" fill="none"/>
      </g>

      <!-- Single small leaf -->
      <g id="leaf">
        <path d="M 0 0 Q 14 -10 22 -28 Q 12 -22 0 0 Z" fill="#9ab98e"/>
        <path d="M 4 -6 L 18 -22" stroke="#5e8a55" stroke-width="1.2" stroke-linecap="round"/>
      </g>

      <!--
        CHARACTERS — flat illustrated heads & shoulders.
        Drawn at natural size, centered on (0,0). Use via <g transform> to place.
      -->

      <!-- Character A — long dark hair tied back, yellow shirt -->
      <g id="char-A">
        <!-- shoulders / clothing -->
        <path d="M -78 60 Q -72 22 -42 16 L 42 16 Q 72 22 78 60 L 86 140 L -86 140 Z"
              fill="#FFC614"/>
        <!-- neck -->
        <path d="M -16 10 L -14 38 L 14 38 L 16 10 Z" fill="#e6b58a"/>
        <!-- hair back layer (frames face & extends below shoulders) -->
        <path d="M -52 -10 Q -56 -68 0 -76 Q 56 -68 52 -10 L 56 30 Q 62 70 50 110 L 38 100 Q 32 60 30 30 L -30 30 Q -32 60 -38 100 L -50 110 Q -62 70 -56 30 Z"
              fill="#2b1d18"/>
        <!-- face -->
        <ellipse cx="0" cy="-10" rx="42" ry="50" fill="#e6b58a"/>
        <!-- hair top (bangs / parted hair) -->
        <path d="M -42 -28 Q -38 -64 0 -68 Q 38 -64 42 -28 Q 38 -42 18 -42 Q 4 -42 -2 -34 Q -10 -42 -22 -42 Q -38 -42 -42 -28 Z"
              fill="#2b1d18"/>
        <!-- eyes -->
        <g fill="#1f1a2e">
          <ellipse cx="-14" cy="-8" rx="2.6" ry="3.4"/>
          <ellipse cx=" 14" cy="-8" rx="2.6" ry="3.4"/>
        </g>
        <!-- soft brows -->
        <g stroke="#1f1a2e" stroke-width="2.2" stroke-linecap="round" fill="none">
          <path d="M -22 -20 Q -14 -23 -6 -19"/>
          <path d="M  22 -20 Q  14 -23  6 -19"/>
        </g>
        <!-- cheek blush -->
        <ellipse cx="-26" cy="6" rx="6" ry="3" fill="#e08a76" opacity="0.55"/>
        <ellipse cx=" 26" cy="6" rx="6" ry="3" fill="#e08a76" opacity="0.55"/>
        <!-- gentle smile -->
        <path d="M -10 14 Q 0 22 10 14"
              stroke="#1f1a2e" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      </g>

      <!-- Character B — wearing a sage-green hijab, warm-medium skin -->
      <g id="char-B">
        <!-- hijab back layer (drapes over shoulders) -->
        <path d="M -76 -34 Q -90 -78 0 -80 Q 90 -78 76 -34
                 L 90 30 Q 96 90 60 130 L -60 130 Q -96 90 -90 30 Z"
              fill="#9ab98e"/>
        <!-- face -->
        <ellipse cx="0" cy="-6" rx="40" ry="46" fill="#c4885d"/>
        <!-- hijab front edge (frames face) -->
        <path d="M -42 -38 Q -42 -64 0 -66 Q 42 -64 42 -38
                 L 50 -6 Q 46 4 26 6 Q 0 8 -26 6 Q -46 4 -50 -6 Z"
              fill="#9ab98e"/>
        <!-- subtle hijab shadow -->
        <path d="M -42 -38 Q -42 -28 -36 -22 L 36 -22 Q 42 -28 42 -38"
              fill="#7da673"/>
        <!-- eyes -->
        <g fill="#1f1a2e">
          <ellipse cx="-13" cy="-2" rx="2.6" ry="3.4"/>
          <ellipse cx=" 13" cy="-2" rx="2.6" ry="3.4"/>
        </g>
        <!-- brows -->
        <g stroke="#1f1a2e" stroke-width="2.2" stroke-linecap="round" fill="none">
          <path d="M -22 -14 Q -14 -17 -6 -13"/>
          <path d="M  22 -14 Q  14 -17  6 -13"/>
        </g>
        <!-- cheek blush -->
        <ellipse cx="-22" cy="12" rx="6" ry="3" fill="#d97b65" opacity="0.55"/>
        <ellipse cx=" 22" cy="12" rx="6" ry="3" fill="#d97b65" opacity="0.55"/>
        <!-- gentle smile -->
        <path d="M -8 20 Q 0 26 8 20"
              stroke="#1f1a2e" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      </g>

      <!-- Character C — short curly hair, coral shirt, warm-deep skin -->
      <g id="char-C">
        <!-- shoulders / clothing -->
        <path d="M -78 60 Q -72 22 -42 16 L 42 16 Q 72 22 78 60 L 86 140 L -86 140 Z"
              fill="#EF534C"/>
        <!-- neck -->
        <path d="M -16 10 L -14 38 L 14 38 L 16 10 Z" fill="#8e5a3a"/>
        <!-- face -->
        <ellipse cx="0" cy="-10" rx="42" ry="48" fill="#8e5a3a"/>
        <!-- curly hair — cluster of small circles forming a soft puff -->
        <g fill="#15100c">
          <circle cx="-30" cy="-52" r="15"/>
          <circle cx="-10" cy="-62" r="16"/>
          <circle cx=" 14" cy="-62" r="16"/>
          <circle cx=" 34" cy="-52" r="15"/>
          <circle cx="-42" cy="-34" r="12"/>
          <circle cx=" 42" cy="-34" r="12"/>
          <circle cx="-22" cy="-44" r="9"/>
          <circle cx=" 22" cy="-44" r="9"/>
        </g>
        <!-- eyes -->
        <g fill="#1f1a2e">
          <ellipse cx="-14" cy="-8" rx="2.6" ry="3.4"/>
          <ellipse cx=" 14" cy="-8" rx="2.6" ry="3.4"/>
        </g>
        <!-- brows -->
        <g stroke="#1f1a2e" stroke-width="2.2" stroke-linecap="round" fill="none">
          <path d="M -22 -20 Q -14 -23 -6 -19"/>
          <path d="M  22 -20 Q  14 -23  6 -19"/>
        </g>
        <!-- cheek highlights (subtle on darker skin) -->
        <ellipse cx="-24" cy="6" rx="6" ry="3" fill="#c97056" opacity="0.55"/>
        <ellipse cx=" 24" cy="6" rx="6" ry="3" fill="#c97056" opacity="0.55"/>
        <!-- gentle smile -->
        <path d="M -10 14 Q 0 22 10 14"
              stroke="#1f1a2e" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      </g>
    </defs>

    <!-- BACKGROUND BOTANICAL ACCENTS -->
    <g transform="translate(960 110) rotate(20)" filter="url(#soft)">
      <use href="#sprig"/>
    </g>
    <g transform="translate(110 800) rotate(-160) scale(0.85)" filter="url(#soft)">
      <use href="#sprig"/>
    </g>

    <!-- ============================
         SPEECH BUBBLES (paired with characters)
         ============================ -->

    <!-- Bubble for Character A — lavender circle with heart (upper, between A and centre) -->
    <g filter="url(#soft)" transform="translate(440 165) rotate(-10)">
      <circle r="88" fill="#b9aaee"/>
      <!-- tail pointing down-left toward Char A -->
      <path d="M -52 64 L -90 110 L -42 80 Z" fill="#b9aaee"/>
      <!-- heart -->
      <path d="M 0 16
               C -26 -2, -34 -34, -14 -42
               C -2 -48, 0 -34, 0 -28
               C 0 -34, 4 -48, 14 -42
               C 34 -34, 26 -2, 0 16 Z"
            fill="#ffffff"/>
    </g>

    <!-- Bubble for Character B — yellow squircle with typing dots (upper, near B) -->
    <g filter="url(#soft)" transform="translate(680 150) rotate(8)">
      <path d="M -100 -68
               C -100 -100, -60 -100, 0 -100
               C 60 -100, 100 -100, 100 -68
               C 100 -40, 100 -12, 100 16
               C 100 48, 60 48, 0 48
               L 30 48
               L 52 80
               L 36 48
               L -60 48
               C -100 48, -100 16, -100 -12 Z"
            fill="#FFC614"/>
      <!-- typing dots -->
      <g fill="#1f1a2e">
        <circle cx="-26" cy="-26" r="6"/>
        <circle cx="  0" cy="-26" r="6"/>
        <circle cx=" 26" cy="-26" r="6"/>
      </g>
    </g>

    <!-- Bubble for Character C — coral rounded rectangle with ellipsis (middle, near C) -->
    <g filter="url(#soft)" transform="translate(720 530) rotate(6)">
      <path d="M -120 -70
               Q -140 -70 -140 -50
               L -140  44
               Q -140  64 -120 64
               L -50   64
               L -70   96
               L -28   64
               L  120  64
               Q  140  64  140  44
               L  140 -50
               Q  140 -70 120 -70 Z"
            fill="#EF534C"/>
      <g fill="#ffffff">
        <circle cx="-32" cy="-4" r="9"/>
        <circle cx="  0" cy="-4" r="9"/>
        <circle cx=" 32" cy="-4" r="9"/>
      </g>
    </g>

    <!-- Atmospheric bubble — soft lavender squircle (no character; suggests another voice listening) -->
    <g filter="url(#soft)" transform="translate(220 540) rotate(-8)">
      <path d="M -78 -42
               C -98 -42, -98 -16, -98 4
               C -98 28, -78 42, -56 42
               L -24 42
               L -42 70
               L -16 42
               L  44 42
               C 68 42, 88 28, 88 4
               C 88 -16, 88 -42, 64 -42 Z"
            fill="#d9d0f7"/>
      <g fill="#7a68c9">
        <circle cx="-22" cy="2" r="5"/>
        <circle cx="  0" cy="2" r="5"/>
        <circle cx=" 22" cy="2" r="5"/>
      </g>
    </g>

    <!-- Atmospheric bubble — small green organic with leaf (botanical voice) -->
    <g filter="url(#soft)" transform="translate(540 800) rotate(-6)">
      <path d="M -76 -28
               C -94 -56, -56 -78, -16 -74
               C 30 -68, 84 -56, 84 -20
               C 84 18, 64 44, 22 46
               L 0 70
               L -8 46
               C -50 44, -82 30, -94 4
               C -100 -6, -88 -16, -76 -28 Z"
            fill="#76C691"/>
      <!-- tiny leaf inside -->
      <g transform="translate(0 -6) scale(0.7)">
        <path d="M 0 18 Q 14 0 24 -22 Q 14 -8 0 18 Z" fill="#ffffff"/>
        <path d="M -16 0 Q -6 -16 6 -32 Q -4 -22 -16 0 Z" fill="#ffffff"/>
        <path d="M 0 18 Q -8 -20 4 -32" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
      </g>
    </g>

    <!-- ============================
         CHARACTERS — placed last so they sit on top of background
         ============================ -->

    <!-- A: upper-left -->
    <g transform="translate(245 400)" filter="url(#soft)">
      <use href="#char-A"/>
    </g>

    <!-- B: upper-right -->
    <g transform="translate(875 410)" filter="url(#soft)">
      <use href="#char-B"/>
    </g>

    <!-- C: lower-centre, slightly forward -->
    <g transform="translate(460 660)" filter="url(#soft)">
      <use href="#char-C"/>
    </g>

  </svg>

  <!-- TITLE -->
  <h1 class="title">
    <span class="l1">Caregivers</span>
    <span class="l2">Circle<span class="dot">.</span></span>
    <div class="baseline"></div>
  </h1>

</div>

</body>
</html>
